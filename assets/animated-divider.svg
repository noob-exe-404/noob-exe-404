<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 6" fill="none" width="100%" height="6">
  <defs>
    <linearGradient id="cream-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="25%" stop-color="#262626" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F5F2EB" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#262626" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
      <animate attributeName="x1" from="-100%" to="100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="1000" height="2" rx="1" fill="#141414" />
  <rect x="0" y="1" width="1000" height="3" rx="1.5" fill="url(#cream-pulse)" />
</svg>
