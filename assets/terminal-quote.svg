<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; stroke: #222222; stroke-width: 1.5; rx: 10px; }
      .header-bar { fill: #080808; }
      .dot-1 { fill: #262626; }
      .dot-2 { fill: #3D3D3D; }
      .dot-3 { fill: #545454; }
      .title { fill: #8C857B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
      .code { font-family: "Fira Code", "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 13.5px; }
      .kwd { fill: #D4CEBD; font-weight: 700; }
      .cls { fill: #F5F2EB; font-weight: 700; }
      .prop { fill: #B8B2A6; }
      .str { fill: #F5F2EB; }
      .comment { fill: #5E5A52; font-style: italic; }
      .punct { fill: #8C857B; }
      .cursor { fill: #F5F2EB; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="848" height="248" class="bg" />

  <!-- Terminal Header Bar -->
  <path d="M 1 10 C 1 5.029 5.029 1 10 1 L 840 1 C 844.971 1 849 5.029 849 10 L 849 34 L 1 34 Z" class="header-bar" />
  <line x1="1" y1="34" x2="849" y2="34" stroke="#222222" stroke-width="1" />

  <!-- Window Action Buttons (Monochrome Minimalist) -->
  <circle cx="20" cy="17" r="5" class="dot-1" />
  <circle cx="36" cy="17" r="5" class="dot-2" />
  <circle cx="52" cy="17" r="5" class="dot-3" />
  <text x="425" y="21" text-anchor="middle" class="title">ayush@noob-exe-404:~</text>

  <!-- Code Body -->
  <g class="code">
    <text x="28" y="68">
      <tspan class="kwd">class</tspan> <tspan class="cls">AyushDas</tspan><tspan class="punct">:</tspan>
    </text>
    <text x="56" y="96">
      <tspan class="kwd">def</tspan> <tspan class="cls">__init__</tspan><tspan class="punct">(self):</tspan>
    </text>
    <text x="84" y="124">
      <tspan class="prop">self.identity</tspan> <tspan class="punct">=</tspan> <tspan class="str">"Ayush Das (@noob-exe-404)"</tspan>
    </text>
    <text x="84" y="152">
      <tspan class="prop">self.focus</tspan> <tspan class="punct">=</tspan> <tspan class="str">["Machine Learning", "Neural Systems", "High-Performance Code"]</tspan>
    </text>
    <text x="84" y="180">
      <tspan class="prop">self.philosophy</tspan> <tspan class="punct">=</tspan> <tspan class="str">"If it works, don't touch it. THANK U &#128528;"</tspan>
    </text>
    <text x="84" y="212">
      <tspan class="comment"># Status: Ready to engineer the future</tspan>
      <tspan dx="8" class="cursor">&#x2588;
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </tspan>
    </text>
  </g>
</svg>
