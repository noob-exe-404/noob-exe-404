<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #0D1117; stroke: #30363D; stroke-width: 1.5; rx: 10px; }
      .title-bar { fill: #161B22; }
      .dot-red { fill: #FF5F56; }
      .dot-yellow { fill: #FFBD2E; }
      .dot-green { fill: #27C93F; }
      .title-text { fill: #8B949E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 500; }
      .term-text { font-family: "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 13px; }
      .prompt { fill: #8B949E; }
      .user { fill: #D4CEBD; font-weight: 600; }
      .cmd { fill: #F5F2EB; font-weight: 600; }
      .tag-404 { fill: #F85149; font-weight: 600; }
      .tag-ok { fill: #3FB950; font-weight: 600; }
      .label { fill: #8B949E; }
      .val { fill: #F5F2EB; }
      .cursor { fill: #F5F2EB; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="1" y="1" width="698" height="228" class="window-bg" />

  <!-- Title Bar -->
  <path d="M 1 10 C 1 5 5 1 10 1 L 690 1 C 695 1 699 5 699 10 L 699 34 L 1 34 Z" class="title-bar" />
  <line x1="1" y1="34" x2="699" y2="34" stroke="#30363D" stroke-width="1" />

  <!-- macOS Window Control Dots -->
  <circle cx="20" cy="17" r="5.5" class="dot-red" />
  <circle cx="36" cy="17" r="5.5" class="dot-yellow" />
  <circle cx="52" cy="17" r="5.5" class="dot-green" />
  <text x="350" y="21" text-anchor="middle" class="title-text">ayush@noob-exe-404:~ (zsh)</text>

  <!-- Terminal Session -->
  <g class="term-text">
    <!-- Command Line -->
    <text x="24" y="66">
      <tspan class="user">ayush@terminal</tspan><tspan class="prompt">:~$</tspan> <tspan class="cmd">./check_status.sh</tspan>
    </text>

    <!-- Output 1: Motivation -->
    <text x="24" y="98">
      <tspan class="tag-404">[ 404 ]</tspan> <tspan class="label">Motivation   :</tspan> <tspan class="val">Not Found</tspan>
    </text>

    <!-- Output 2: Bio -->
    <text x="24" y="126">
      <tspan class="tag-ok">[  OK  ]</tspan> <tspan class="label">Identity     :</tspan> <tspan class="val">"Ahh... I do nothing. I am a noob. Welcome."</tspan>
    </text>

    <!-- Output 3: Rule -->
    <text x="24" y="154">
      <tspan class="tag-ok">[  OK  ]</tspan> <tspan class="label">Golden Rule  :</tspan> <tspan class="val">"If it works, don't touch it. THANK U &#128528;"</tspan>
    </text>

    <!-- Output 4: Next Prompt & Blinking Cursor -->
    <text x="24" y="192">
      <tspan class="user">ayush@terminal</tspan><tspan class="prompt">:~$</tspan> <tspan class="cursor">&#x2588;
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
      </tspan>
    </text>
  </g>
</svg>
